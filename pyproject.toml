[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "settle-trace"
version = "0.7.0"
description = "贸易服务结算与费用追溯：代理费用结算单的核对与来源追溯（旁路、只读、可审计）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zjmnb666" }]
keywords = ["settlement", "reconciliation", "audit-trail", "rag", "agent"]

# 依赖不钉版本，锁定版本见 requirements.txt（那份才是复现依据）。
# 理由：pyproject 用于 pip install -e . 的开发安装，钉死版本会和 requirements 双份维护、
# 迟早不同步；CI 与部署统一走 requirements.txt。
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "rank-bm25>=0.2",
    "jieba>=0.42",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
]

[project.urls]
Homepage = "https://github.com/zjmnb666/settle-trace"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# 页面与静态资源是运行必需的，打包时必须带上，否则安装后访问 /、/agent、/admin 会 404。
[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F 是语法与基础错误；I 是 import 排序。
select = ["E", "F", "I"]
ignore = ["E501"]
