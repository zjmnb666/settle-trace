<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>{{ title }} · SettleTrace 管理后台</title>
<style>
  /* 与对话页共用一套颜色与字体，避免两个界面像两个产品 */
  :root {
    --c-bg: #f5f7fa; --c-panel: #fff; --c-text: #1f2937; --c-sub: #6b7280;
    --c-line: #e5e7eb; --c-primary: #1565c0; --c-primary-weak: #e8f0fb;
    --c-danger: #b42318; --c-danger-bg: #fef3f2; --c-ok: #067647;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--c-bg); color: var(--c-text);
    font: 14px/1.65 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  .layout { display: flex; min-height: 100vh; }

  /* 侧栏 */
  .side {
    width: 210px; flex: 0 0 210px; background: #fff;
    border-right: 1px solid var(--c-line); display: flex; flex-direction: column;
  }
  .side .brand { padding: 18px 18px 14px; border-bottom: 1px solid var(--c-line); }
  .side .brand b { display: block; font-size: 15px; }
  .side .brand span { font-size: 12px; color: var(--c-sub); }
  .side nav { padding: 10px 8px; flex: 1; }
  .side nav a {
    display: block; padding: 8px 12px; margin-bottom: 2px; border-radius: 6px;
    color: var(--c-text); text-decoration: none; font-size: 14px;
  }
  .side nav a:hover { background: #f3f6fa; }
  .side nav a.on { background: var(--c-primary-weak); color: var(--c-primary); font-weight: 600; }
  .side .foot { padding: 12px 18px; border-top: 1px solid var(--c-line); font-size: 12px; color: var(--c-sub); }

  /* 主区 */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 56px; background: #fff; border-bottom: 1px solid var(--c-line);
    display: flex; align-items: center; padding: 0 22px; gap: 12px;
  }
  .topbar h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .topbar .sp { flex: 1; }
  .who { font-size: 13px; color: var(--c-sub); }
  .who b { color: var(--c-text); font-weight: 600; }
  .content { padding: 22px; max-width: 1180px; }

  /* 卡片与表格 */
  .card {
    background: #fff; border: 1px solid var(--c-line); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
  .grid4 { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat {
    background: #fff; border: 1px solid var(--c-line); border-radius: var(--radius);
    padding: 14px 16px; min-width: 180px; flex: 1;
  }
  .stat .k { font-size: 12px; color: var(--c-sub); }
  .stat .v { font-size: 26px; font-weight: 700; color: var(--c-primary); line-height: 1.3; }
  .stat .u { font-size: 12px; color: var(--c-sub); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--c-line); }
  th { color: var(--c-sub); font-weight: 600; background: #fafbfc; }
  tr:hover td { background: #fcfdff; }

  .btn {
    font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--c-line); background: #fff; color: var(--c-text);
  }
  .btn:hover { border-color: #c7ccd4; }
  .btn.primary { background: var(--c-primary); border-color: var(--c-primary); color: #fff; }
  .btn.danger { color: var(--c-danger); border-color: #f0c8c4; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .tag {
    display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px;
    background: var(--c-primary-weak); color: var(--c-primary);
  }
  .tag.grey { background: #f3f4f6; color: var(--c-sub); }
  .tag.red { background: var(--c-danger-bg); color: var(--c-danger); }
  .tag.ok { background: #e7f6ec; color: var(--c-ok); }

  .banner {
    display: none; padding: 10px 12px; border-radius: 6px; font-size: 13px;
    background: var(--c-danger-bg); color: var(--c-danger);
    border: 1px solid #f6cfcb; margin-bottom: 14px;
  }
  .banner.on { display: block; }
  .muted { color: var(--c-sub); font-size: 13px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">
      <b>SettleTrace</b>
      <span>管理后台</span>
    </div>
    <nav>
      {% for m in menus %}
        <a href="{{ m.path }}" class="{% if m.path == active %}on{% endif %}">{{ m.title }}</a>
      {% endfor %}
    </nav>
    <div class="foot">
      只读旁路 · 模型只出建议
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1>{{ title }}</h1>
      <div class="sp"></div>
      <span class="who">{{ user.display_name or user.username }}
        <span class="tag grey">{{ user.role }}</span>
        {% if user.is_admin %}<span class="tag">admin</span>{% endif %}
      </span>
      <button class="btn" id="logoutBtn">退出</button>
    </div>

    <div class="content">
      <div class="banner" id="banner"></div>
      {% block content %}{% endblock %}
    </div>
  </div>
</div>

<script>
  // CSRF token 由服务端渲染到 meta，所有写操作都要带它
  const CSRF = document.querySelector('meta[name="csrf-token"]').content;
  const banner = document.getElementById('banner');

  function showError(msg) {
    banner.textContent = msg;
    banner.classList.add('on');
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/admin/api/logout', { method: 'POST', headers: { 'X-CSRF-Token': CSRF } });
    location.href = '/admin/login';
  });
</script>
{% block script %}{% endblock %}
</body>
</html>
